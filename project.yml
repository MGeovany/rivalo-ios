name: Rivalo
options:
  bundleIdPrefix: com.mgeovany.rivalo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.1"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.58.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Rivalo:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Resources/PlayerCardAssets
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: PostHog
        product: PostHog
      - target: RivaloWatch
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Isotipo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # API base URL for the backend, sourced from a build setting so it can be
        # overridden per configuration.
        RivaloAPIBaseURL: $(RIVALO_API_BASE_URL)
        # Supabase Auth configuration (anon key is a public client key by design).
        SupabaseURL: $(RIVALO_SUPABASE_URL)
        SupabaseAnonKey: $(RIVALO_SUPABASE_ANON_KEY)
        # Allow plain-HTTP requests to the local backend during development.
        NSPhotoLibraryUsageDescription: Rivalo uses your photo library to set your player card picture.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - Michroma-Regular.ttf
          - Rajdhani-Regular.ttf
          - Rajdhani-Medium.ttf
          - Rajdhani-SemiBold.ttf
          - Rajdhani-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgeovany.rivalo
        # iPhone only (1). The app is portrait and paired with Apple Watch; this
        # also avoids the iPad "all orientations" requirement.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        RIVALO_API_BASE_URL: https://c3lsbw3yckoiplvyg6u2nd3nau0mqsqj.lambda-url.us-east-2.on.aws
        RIVALO_SUPABASE_URL: https://alvwjjygmtzrporpmwsp.supabase.co
        RIVALO_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdndqanlnbXR6cnBvcnBtd3NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDUzMDgsImV4cCI6MjA5NTkyMTMwOH0.yvQ8V3eFusmFCm4lWM5kpzxpKiAIJqC3xiRHg8Ox34c

  # watchOS app, embedded into the iOS app above for a real companion pairing.
  # Sources live in the sibling rivalo-watch repo (both repos must be cloned as
  # siblings under the same parent directory). Generated Info.plist/entitlements
  # are written here in rivalo-ios to avoid clobbering the watch repo's own.
  RivaloWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: ../rivalo-watch/Sources
        excludes:
          - "Info.plist"
          - "*.entitlements"
    info:
      path: WatchSupport/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mgeovany.rivalo
        CFBundleDisplayName: Rivalo
        UIAppFonts:
          - Michroma-Regular.ttf
          - Rajdhani-Regular.ttf
          - Rajdhani-Medium.ttf
          - Rajdhani-SemiBold.ttf
          - Rajdhani-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Isotipo
          UIImageRespectsSafeAreaInsets: true
        NSHealthShareUsageDescription: Rivalo reads your heart rate, distance and energy during a match to build your performance summary.
        NSHealthUpdateUsageDescription: Rivalo saves each match as a workout in the Health app.
        WKBackgroundModes:
          - workout-processing
          - self-restorable
    entitlements:
      path: WatchSupport/RivaloWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgeovany.rivalo.watchkitapp
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Rivalo:
    build:
      targets:
        Rivalo: all
    run:
      environmentVariables:
        POSTHOG_PROJECT_TOKEN:
          value: phc_C6YFLY4Rn6vSqQegH4G4c3nR9seBPZyxqwTpx94RQGZz
          isEnabled: true
        POSTHOG_HOST:
          value: https://us.i.posthog.com
          isEnabled: true
